name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"

      - name: Verify formatting
        run: |
          gofmt -l . | tee /tmp/fmt.out
          test ! -s /tmp/fmt.out

      # cmd/radarx-gui needs cgo + libgtk-3/libwebkit2gtk system packages, its
      # own OS build matrix, and a built frontend/dist for its //go:embed —
      # that's handled by the dedicated release workflow, not this fast
      # CLI+library sanity job. Listed explicitly (not "./..." minus a grep)
      # because `go list ./...` itself fails outright when cmd/radarx-gui's
      # embed pattern can't find frontend/dist, taking every other package
      # down with it.
      - name: Vet
        run: go vet ./cmd/radarx/... ./internal/...

      - name: Test
        run: go test -race ./cmd/radarx/... ./internal/...

      - name: Build
        run: go build ./cmd/radarx/... ./internal/...

  cross-compile:
    name: cross-compile
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o /tmp/radarx-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/radarx
