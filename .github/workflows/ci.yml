name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"

      - name: Verify formatting
        run: |
          gofmt -l . | tee /tmp/fmt.out
          test ! -s /tmp/fmt.out

      # cmd/radarx-gui needs cgo + libgtk-3/libwebkit2gtk system packages and
      # its own OS build matrix — that's handled by the dedicated GUI/release
      # workflow, not this fast CLI+library sanity job.
      - name: Vet
        run: go vet $(go list ./... | grep -v /cmd/radarx-gui)

      - name: Test
        run: go test -race $(go list ./... | grep -v /cmd/radarx-gui)

      - name: Build
        run: go build $(go list ./... | grep -v /cmd/radarx-gui)

  cross-compile:
    name: cross-compile
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o /tmp/radarx-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/radarx
