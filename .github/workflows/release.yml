name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  GO_VERSION: "1.25.0"
  NODE_VERSION: "20"
  WAILS_VERSION: "v2.14.0"

jobs:
  cli:
    name: cli (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build radarx-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -ldflags "-X main.version=${{ github.ref_name }}" \
            -o "dist/radarx-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" \
            ./cmd/radarx

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: radarx-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/radarx-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error

  gui:
    name: gui (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Linux GUI build dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build GUI (Linux)
        if: matrix.goos == 'linux'
        working-directory: cmd/radarx-gui
        run: wails build -tags webkit2_41 -ldflags "-X main.version=${{ github.ref_name }}"

      - name: Build GUI (Windows/macOS)
        if: matrix.goos != 'linux'
        working-directory: cmd/radarx-gui
        run: wails build -ldflags "-X main.version=${{ github.ref_name }}"

      - name: Package artifact (Linux)
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          mkdir -p dist
          cp cmd/radarx-gui/build/bin/radarx-gui "dist/radarx-gui-linux-amd64"

      - name: Package artifact (Windows)
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          mkdir -p dist
          cp cmd/radarx-gui/build/bin/radarx-gui.exe "dist/radarx-gui-windows-amd64.exe"

      - name: Package artifact (macOS)
        if: matrix.goos == 'darwin'
        shell: bash
        run: |
          mkdir -p dist
          cd cmd/radarx-gui/build/bin
          zip -r "../../../../dist/radarx-gui-darwin-arm64.app.zip" radarx-gui.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: radarx-gui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    runs-on: ubuntu-latest
    needs: [cli, gui]
    if: always() && (needs.cli.result == 'success' || needs.gui.result == 'success')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            Automated release for ${{ github.ref_name }}.

            See CHANGELOG.md for details.
          files: release/*
          fail_on_unmatched_files: true
